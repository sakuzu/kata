<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded</title>
    <style>
      /* The page that kata does not own: its own font, and scrollbar colors that its elements inherit */
      html {
        scrollbar-color: #7a7a7a #e6e6e6;
      }
      body {
        margin: 0;
        font-family: Georgia, serif;
      }
      .host {
        padding: 12px 16px;
      }
      /* The root of kata in the page (docs/layout.md, Embedding kata). It sets what the base CSS
       * sets on the body: the font, the text color and the ground, and the size container of the
       * three widths. Under it, the reset of the base CSS, limited to the root */
      .embed-root {
        container: app / inline-size;
        background: var(--kata-color-ground);
        color: var(--kata-color-text);
        font-family: var(--kata-font-sans);
        font-size: var(--kata-text-size-body);
        line-height: var(--kata-text-leading-body);
        letter-spacing: var(--kata-text-tracking-body);
      }
      :where(.embed-root),
      :where(.embed-root) *,
      :where(.embed-root) *::before,
      :where(.embed-root) *::after {
        box-sizing: border-box;
      }
      :where(.embed-root) :is(h1, h2, h3, p, ul, ol, dl, dd, figure) {
        margin: 0;
      }
      :where(.embed-root) :is(ul, ol) {
        padding: 0;
        list-style: none;
      }
      :where(.embed-root) :is(button, input, select, textarea) {
        border: 0;
        padding: 0;
        font: inherit;
        color: inherit;
      }
      :where(.embed-root) :is(td, th) {
        padding: 0;
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <p class="host">A page that kata does not own, with kata embedded below.</p>
    <div class="embed-root" data-kata-root lang="en"></div>
  </body>
</html>
